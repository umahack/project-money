name: Nightly Turso DB backup

# Dumps the production Turso database every night at 18:00 UTC (23:30 IST)
# and stores the .sql file as a workflow artifact for 90 days. Also runs on
# manual trigger. The dump is a plain SQL file (CREATE TABLE + INSERT) that
# can be replayed into a new libSQL/SQLite database for recovery.
#
# Required repo secrets:
#   TURSO_DB_NAME       — name of the Turso database (e.g. project-money-prod)
#   TURSO_AUTH_TOKEN    — a token with read access to that database

on:
  schedule:
    # 18:00 UTC daily (23:30 IST). GitHub Actions cron is UTC.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Dump database
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DB_NAME: ${{ secrets.TURSO_DB_NAME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.turso:$PATH"
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT="turso-backup-${STAMP}.sql"
          turso db shell "$DB_NAME" ".dump" > "$OUT"
          # Guard against an empty dump (would silently publish a useless artifact).
          test -s "$OUT"
          wc -l "$OUT"
          gzip "$OUT"
          echo "ARTIFACT_PATH=${OUT}.gz" >> "$GITHUB_ENV"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ env.STAMP }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 90
          if-no-files-found: error
