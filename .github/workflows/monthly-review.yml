name: Monthly review email

# Fires on the 1st of each month at 03:30 UTC (09:00 IST). Walks every user
# via the production Turso DB and sends them a wrap-up of the previous
# month's finances through Resend. Idempotent per (user, month) via
# monthly_review_log.
#
# Required repo secrets:
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   RESEND_API_KEY
#   MAIL_FROM          (optional)

on:
  schedule:
    - cron: '30 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print recipients, do not send'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Send monthly review
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:          ${{ secrets.MAIL_FROM }}
          # JWT_SECRET isn't used by the mailer but src/server.js guards boot
          # on its presence, and src/db/index.js imports from a path that
          # won't load server.js. We don't need it; left unset is fine.
          MONTHLY_REVIEW_DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '1' || '0' }}
        run: node scripts/send-monthly-review.js
