services:
  - type: web
    name: project-money-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates public traffic and forwards it into this container.
      - key: HOST
        value: 0.0.0.0
      # Pin the server timezone to IST so monthKey/day-of-month/CSV dates
      # match the frontend (which reads the user's local clock). Prevents the
      # 5h30m month-boundary mismatch between IST users and UTC server.
      - key: TZ
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      # Dedicated HMAC key for idempotent financial mutation fingerprints.
      - key: FINANCIAL_MUTATION_HMAC_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Shadow comparison is opt-in and emits mismatch codes only.
      - key: CLARITY_SHADOW_COMPARE
        value: "false"
      - key: ADMIN_EMAILS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Shared secret required by POST /api/internal/cron/monthly-review.
      # Generated by Render on first deploy; copy its value into whatever
      # external scheduler calls that endpoint (e.g. cron-job.org).
      - key: CRON_SECRET
        generateValue: true
    # NOTE: Render's free tier does not support persistent disks.
    # SQLite lives on ephemeral storage — data resets on container restart/redeploy.
    # To keep data permanently: upgrade this service to Starter plan ($7/mo) and
    # re-add the disk block below:
    # disk:
    #   name: pm-data
    #   mountPath: /opt/render/project/src/backend
    #   sizeGB: 1

  - type: web
    name: project-money-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        sync: false
      # Roll back to the established UI/read path unless explicitly enabled.
      - key: VITE_FINANCIAL_CLARITY_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
